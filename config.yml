# config.yml
# Main configuration for the symbolic capital network analysis

default:
  # --- Authoritative Data Sources ---
  # The full position-level workbook is the single source of truth.
  # The interlocking network is derived from it after confirmed name merges.
  full_population_path: "data/Dataset_Editorial_Boards_All.xlsx"
  m49_lookup_path: "data/country_m49_lookup.csv"
  confirmed_merges_path: "data/confirmed_name_merges.csv"

  # Legacy annotated interlocking file. Used ONLY to recover manually coded
  # Gender/ORCID metadata for people already present there; it no longer
  # determines who is interlocking. New editors without a legacy gender code
  # remain explicitly Unknown.
  annotation_path: "data/editorial_board_data.xlsx"

  # Manually verified gender classifications for newly recovered interlocking
  # editors. These values override legacy annotations after canonical matching.
  gender_adjudication_path: "data/gender_adjudication.csv"
  
  # --- Column Mappings (exact headers in your Excel file) ---
  col_orcid: "ORCID"
  col_journal: "Journal"
  col_country: "Country"
  col_continent: "Continent"
  col_subregion: "Subregion"
  col_gender: "Gender"
  
  # --- Network Construction ---
  min_shared_journals: 1
  
  # --- Community Detection ---
  # Resolution for editor communities (lower = fewer, larger communities)
  leiden_resolution: 0.5
  # Resolution for journal communities
  journal_leiden_resolution: 0.5
  
  # --- Reproducibility ---
  seed_layout: 123
  
  # Last updated: 2026-04-28