# config.yml
# Main configuration for the symbolic capital network analysis

default:
  # --- Authoritative Data Sources ---
  # The full position-level workbook is the single source of truth.
  # The interlocking network is derived from it after confirmed name merges.
  full_population_path: "data/Dataset_Editorial_Boards_All.xlsx"
  m49_lookup_path: "data/country_m49_lookup.csv"
  confirmed_merges_path: "data/confirmed_name_merges.csv"

  # Legacy annotated interlocking file. Used only for ORCID metadata and for a
  # separately labelled mixed-instrument sensitivity analysis; it never defines
  # network membership or the primary gender variable.
  annotation_path: "data/editorial_board_data.xlsx"

  # Frozen population-wide NamSor classifications, one row per pre-merge
  # exact-name identity. This is the primary gender measurement source.
  gender_namsor_path: "data/gender_classified_full.csv"

  # Manual adjudications are retained only for sensitivity/descriptive
  # completion. They never override NamSor in the primary inferential analysis.
  gender_adjudication_path: "data/gender_adjudication.csv"
  
  # --- Column Mappings (exact headers in your Excel file) ---
  col_orcid: "ORCID"
  col_journal: "Journal"
  col_country: "Country"
  col_continent: "Continent"
  col_subregion: "Subregion"
  col_gender: "Gender"
  
  # --- Network Construction ---
  min_shared_journals: 1
  
  # --- Community Detection ---
  # Resolution for editor communities (lower = fewer, larger communities)
  leiden_resolution: 0.5
  # Resolution for journal communities
  journal_leiden_resolution: 0.5
  
  # --- Reproducibility ---
  seed_layout: 123
  # Dedicated seed for all Leiden calls. The selected sweep partition is stored
  # and reused by the final editor-network analysis.
  seed_leiden: 123
  
  # Last updated: 2026-04-28